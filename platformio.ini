; Desk Buddy — Elecrow CrowPanel 1.28" ESP32-S3 round display
; Build:  pio run
; Flash:  pio run -t upload        (firmware, over USB, first time)
; Web UI: pio run -t uploadfs      (uploads ./data to LittleFS; user settings live in NVS, so they survive)
; Later updates can go over WiFi (web UI -> Firmware tab).

[env:crowpanel]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8: 16 MB flash, 8 MB octal PSRAM
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src
    ; -DNO_BLE_HID         ; uncomment if the BLE keyboard library will not build
    ; -DBUDDY_TLS_INSECURE ; uncomment only if the TLS certificate bundle is unavailable (see README)
    ; -DBUDDY_TLS_INTERNAL_RAM ; uncomment to keep TLS memory in internal RAM instead of PSRAM (see README)

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@~8.3.11
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit NeoPixel@^1.12.0
    t-vk/ESP32 BLE Keyboard@^0.3.2

; Host-side unit tests for the pure logic (no board needed): see test/host/Makefile
